<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PharmaSafe - Employee Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">

</head>


<body>

<div class="login-page">

    <!-- LEFT SIDE -->

    <div class="login-section">

        <div class="login-content">

            <h1>
                PHARMASAFE
            </h1>

            <p class="system-title">
                PHARMACY MANAGEMENT SYSTEM
            </p>


            <h2>
                Employee Login
            </h2>

            <p class="login-description">
                Please enter your username and password to login.
            </p>


            <form method="POST"
                  action="/login">


                <!-- Username -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <!-- Login button -->

                <button type="submit"
                        class="login-button">

                    LOGIN

                </button>


                <!-- Forgot password -->

                <p class="forgot-password">

                    Forgot your password?

                    <a href="#">
                        Click here
                    </a>

                </p>


            </form>


            <p class="login-footer">
                PharmaSafe © 2026
            </p>

        </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="image-section">

        <div class="image-overlay">

            <h2>
                Smart Pharmacy.
            </h2>

            <p>
                Safer medicines.
                Better patient care.
            </p>

        </div>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add New User - PharmaSafe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        .header {
            background: #123456;
            color: white;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #1976d2;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd4dd;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1976d2;
        }

        .submit-button {
            width: 100%;
            padding: 13px;
            background: #159957;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-button:hover {
            background: #107743;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .success {
            background: #e8f7ee;
            color: #146c36;
        }

        .error {
            background: #fdecec;
            color: #b42318;
        }

    </style>

</head>


<body>


<div class="header">

    <div>
        <h1>PharmaSafe</h1>
        <p>Add New User</p>
    </div>

    <a href="{{ url_for('manager_dashboard') }}"
       class="back">
        ← Manager Dashboard
    </a>

</div>


<div class="container">

    <div class="form-card">

        <h2>Create New User</h2>


        {% if message %}

            <div class="message
                {% if success %}
                    success
                {% else %}
                    error
                {% endif %}
            ">

                {{ message }}

            </div>

        {% endif %}


        <form method="POST" action="{{ url_for('add_employee') }}">


            <div class="form-group">

                <label for="employee_name">
                    Employee Name
                </label>

                <input
                    type="text"
                    id="employee_name"
                    name="employee_name"
                    placeholder="Enter employee name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="role">
                    Role
                </label>

                <select id="role"
                        name="role"
                        required>

                    <option value="employee">
                        Employee
                    </option>

                    <option value="manager">
                        Manager
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="submit-button">

                CREATE USER

            </button>


        </form>

    </div>

</div>


</body>

</html>
